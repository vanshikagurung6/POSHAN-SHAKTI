<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGO Login - Poshan Shakti</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#2e7d32;--yellow:#f9a825;--gray:#f5f7f5;--text:#1b2e1c;--shadow:0 4px 24px rgba(46,125,50,0.15);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    background: url('images/school.jpg') center/cover no-repeat;
    display:flex;flex-direction:column;
  }
  .overlay{
    flex:1;
    background:rgba(0,0,0,0.55);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:20px;
  }
  .login-box{
    background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;
  }
  .login-box img{height:60px;margin-bottom:10px;}
  .login-box h1{font-family:'Baloo 2',cursive;color:var(--green);font-size:1.7rem;font-weight:800;margin-bottom:4px;}
  .login-box p{color:#888;font-size:0.9rem;margin-bottom:28px;}
  .form-group{margin-bottom:16px;text-align:left;}
  label{display:block;font-weight:700;font-size:0.85rem;color:#444;margin-bottom:5px;}
  input{
    width:100%;padding:12px 14px;border:2px solid #dde;border-radius:10px;
    font-size:0.97rem;font-family:'Nunito',sans-serif;transition:border 0.2s;
  }
  input:focus{outline:none;border-color:var(--green);}
  .btn-login{
    width:100%;padding:13px;background:var(--green);color:#fff;border:none;
    border-radius:10px;font-size:1.05rem;font-weight:700;font-family:'Nunito',sans-serif;
    cursor:pointer;margin-top:6px;transition:background 0.2s;
  }
  .btn-login:hover{background:#1b5e20;}
  .error-msg{display:none;background:#ffebee;color:#c62828;padding:10px;border-radius:8px;margin-top:12px;font-weight:700;}
  .divider{margin:18px 0;color:#ccc;font-size:0.85rem;}
  .back-link{color:var(--green);text-decoration:none;font-weight:700;font-size:0.9rem;}
  .back-link:hover{text-decoration:underline;}
  /* Demo credentials note */
  .demo-box{background:#e8f5e9;border-radius:10px;padding:12px;margin-bottom:16px;font-size:0.83rem;color:#2e7d32;text-align:left;}
  .demo-box strong{display:block;margin-bottom:4px;}
</style>
</head>
<body>
<div class="overlay">
  <div class="login-box">
    <img src="images/logo.png" alt="Poshan Shakti Logo">
    <h1>NGO Login</h1>
    <p>Sign in to access the admin dashboard</p>

    <div class="demo-box">
      <strong> Demo Credentials (for testing):</strong>
      Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>poshan123</strong>
    </div>

    
    
    <div class="form-group">
      <label>NGO Username / ID</label>
      <input type="text" id="username" placeholder="Enter your NGO ID" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()"> Login</button>
    <div class="error-msg" id="errorMsg"> Invalid username or password. Try: admin / poshan123</div>

    <div class="divider">— or —</div>
    <a class="back-link" href="index.html">← Back to Homepage</a>
  </div>
</div>

<script>
  function doLogin() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    // Demo login — replace with actual servlet call when backend is ready
    if (u === 'admin' && p === 'poshan123') {
      localStorage.setItem('ps_loggedIn', 'true');
      window.location.href = 'index.html';
    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  }
  // Allow Enter key
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
